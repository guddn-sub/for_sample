<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랜딩페이지 시안 · 제주&amp;하타라시</title>
  <style>
    /* 색·글꼴은 brand.md 기준 */
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

    :root {
      --main: #0B6E8A;
      --point: #F2994A;
      --bg: #F3FAFC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: #000;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    /* 휴대폰 너비 기준 */
    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .hero {
      width: 100%;
      aspect-ratio: 690 / 370;
      background: var(--main);
      border-radius: 4px;
    }

    section { margin-top: 32px; }

    h2 {
      margin: 0 0 12px 4px;
      font-size: 20px;
      font-weight: 600;
      color: var(--main);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1.5px solid var(--main);
      border-top: 4px solid var(--point);
      border-radius: 4px;
    }

    .can .card   { aspect-ratio: 212 / 263; }
    .guide .card { aspect-ratio: 211 / 160; }

    .start {
      display: block;
      width: 100%;
      margin-top: 36px;
      padding: 0;
      height: 56px;
      border: 0;
      border-radius: 4px;
      background: var(--main);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    .start:focus-visible { outline: 3px solid var(--point); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="hero" role="img" aria-label="대표 이미지 자리"></div>

    <section class="can">
      <h2>할 수 있는 일</h2>
      <div class="grid">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </div>
    </section>

    <section class="guide">
      <h2>사용법</h2>
      <div class="grid">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </div>
    </section>

    <button class="start" type="button">시작 버튼</button>
  </main>
</body>
</html>
