<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랜딩페이지 · 제주&amp;하타라시</title>
  <style>
    /* 색·글꼴은 brand.md 기준. 배치는 손그림: 히어로 → 할 수 있는 일 3 → 사용법 3 → 시작 버튼 */
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

    :root {
      --main: #0B6E8A;
      --point: #F2994A;
      --bg: #F3FAFC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: #000;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 휴대폰 너비 기준 */
    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    /* 히어로: 메인 색 면 위에 흰 글자 */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 12px;
      min-height: 220px;
      padding: 24px 20px;
      background: var(--main);
      color: #fff;
      border-radius: 8px;
      border-bottom: 6px solid var(--point);
    }
    .hero .logo {
      width: 56px;
      height: 56px;
      padding: 6px;
      background: #fff;
      border-radius: 14px;
    }
    .hero .logo img { display: block; width: 100%; height: 100%; }
    .hero h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; }
    .hero p  { margin: 0; font-size: 15px; font-weight: 400; }

    section { margin-top: 32px; }

    h2 {
      margin: 0 0 12px 4px;
      font-size: 20px;
      font-weight: 600;
      color: var(--main);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1.5px solid var(--main);
      border-top: 4px solid var(--point);
      border-radius: 4px;
      padding: 12px 10px;
    }
    .card h3 { margin: 8px 0 4px; font-size: 15px; font-weight: 600; color: var(--main); }
    .card p  { margin: 0; font-size: 13px; }

    /* 할 수 있는 일: 세로로 긴 카드 */
    .can .card { min-height: 180px; }

    .icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--point);
      color: #000;
      font-weight: 700;
    }
    .icon svg { width: 22px; height: 22px; }

    /* 사용법: 가로로 납작한 카드 */
    .guide .card { min-height: 110px; padding: 10px; }
    .guide .icon { width: 28px; height: 28px; font-size: 14px; }
    .guide .card p { margin-top: 6px; font-size: 13px; }

    .start {
      display: block;
      width: 100%;
      margin-top: 36px;
      height: 56px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: var(--main);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    .start:hover { filter: brightness(1.1); }
    .start:focus-visible { outline: 3px solid var(--point); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="logo"><img src="images/logo.svg" alt="제주&amp;하타라시 로고"></div>
      <h1>아이와 함께라면,<br>무리 없는 오름으로</h1>
      <p>경사·주차·왕복 소요시간 조건에 맞는 오름을 골라 드려요.</p>
    </header>

    <section class="can">
      <h2>할 수 있는 일</h2>
      <div class="grid">
        <div class="card">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 10 8l4 6 2-3 5 8z"/></svg>
          </div>
          <h3>경사 살펴보기</h3>
          <p>아이 걸음에 맞는 완만한 오름을 찾아요.</p>
        </div>
        <div class="card">
          <div class="icon" aria-hidden="true">P</div>
          <h3>주차 알아보기</h3>
          <p>가까운 주차 정보를 함께 알려 드려요.</p>
        </div>
        <div class="card">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <h3>왕복 시간 확인</h3>
          <p>오르내리는 데 걸리는 시간을 가늠해요.</p>
        </div>
      </div>
    </section>

    <section class="guide">
      <h2>사용법</h2>
      <div class="grid">
        <div class="card">
          <div class="icon" aria-hidden="true">1</div>
          <p>아이 나이와 조건을 알려 주세요.</p>
        </div>
        <div class="card">
          <div class="icon" aria-hidden="true">2</div>
          <p>맞는 오름을 추천받아요.</p>
        </div>
        <div class="card">
          <div class="icon" aria-hidden="true">3</div>
          <p>출발 전 공식 공지를 확인해요.</p>
        </div>
      </div>
    </section>

    <button class="start" type="button">시작하기</button>
  </main>
</body>
</html>
